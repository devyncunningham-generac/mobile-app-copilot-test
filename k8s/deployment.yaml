apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-rating-app
  labels:
    app: restaurant-rating-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: restaurant-rating-app
  template:
    metadata:
      labels:
        app: restaurant-rating-app
    spec:
      containers:
      - name: restaurant-rating-app
        image: your-ecr-repo/restaurant-rating-app:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: aws-region
        - name: AWS_USER_POOL_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: aws-user-pool-id
        - name: AWS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: aws-client-id
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-rating-app-service
spec:
  selector:
    app: restaurant-rating-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurant-rating-app-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: restaurant-rating-app-service
            port:
              number: 80